<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WireView 控制中心</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand"><span class="brand-mark"><img src="ui/wireview-app-icon.png" alt="WireView"></span><span>WireView 有线副屏 <i>—</i> USB 平板副屏 <small class="brand-version">版本 1.1.20</small></span></div>
      <div class="header-actions">
        <button id="settings-toggle" class="icon-button" type="button" title="设置" aria-label="设置" aria-expanded="false">⚙</button>
        <section id="settings-panel" class="settings-panel" aria-hidden="true">
          <div class="settings-panel-heading">
            <div>
              <span class="settings-eyebrow">设置</span>
              <strong>关于 WireView</strong>
              <small>版本 1.1.20 · USB Android 副屏工具</small>
            </div>
          </div>
          <p class="settings-description">视频和控制数据仅通过 USB / 本机 ADB 通道传输，不经过云端服务器。</p>
          <div class="settings-toggle-row">
            <span><strong>重连自动投屏</strong><small id="auto-resume-state">已关闭</small></span>
            <button id="auto-resume-toggle" class="toggle" type="button" role="switch" aria-checked="false" aria-label="重连自动投屏"><i></i></button>
          </div>
          <div class="settings-toggle-row">
            <span><strong>低延迟解码（实验）</strong><small id="low-latency-state">已关闭</small></span>
            <button id="low-latency-toggle" class="toggle" type="button" role="switch" aria-checked="false" aria-label="低延迟解码"><i></i></button>
          </div>
          <div class="settings-toggle-row">
            <span><strong>暗色模式</strong><small>当前已开启</small></span>
            <button id="theme-toggle" class="toggle is-on" type="button" role="switch" aria-checked="true" aria-label="切换暗色模式"><i></i></button>
          </div>
        </section>
      </div>
    </header>
    <nav class="tabs" aria-label="控制中心模式">
      <button class="tab is-active" data-mode="simple">简易模式</button>
      <button class="tab" data-mode="full">完整模式</button>
    </nav>
    <section id="simple-page" class="page"></section>
    <section id="full-page" class="page is-hidden"></section>
    <section id="diagnostics-page" class="page is-hidden"></section>
    <footer id="status-bar" class="status-bar"></footer>
  </main>
  <div id="mode-switch-dialog" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mode-switch-title">
      <strong id="mode-switch-title">切换投屏方式？</strong>
      <p id="mode-switch-text">当前正在投屏，切换方式会先停止当前投屏，再按新方式重新开始。</p>
      <div class="modal-actions">
        <button id="mode-switch-cancel" type="button">取消</button>
        <button id="mode-switch-confirm" type="button" class="primary-button">确认切换</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
